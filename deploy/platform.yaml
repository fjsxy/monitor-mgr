apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: monitor-mgr-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor-mgr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: monitor-mgr}
  template:
    metadata:
      labels: {app: monitor-mgr}
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: platform
          image: monitor-mgr:development
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 1
            periodSeconds: 3
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: monitor-mgr-data}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor-mgr
spec:
  selector: {app: monitor-mgr}
  ports:
    - {name: http, port: 8080, targetPort: http}
