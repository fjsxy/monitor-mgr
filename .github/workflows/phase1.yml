name: 一期 UT 与真实双集群 E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
# UT、三个 E2E 组与汇总均 checkout 同一个真实候选，PR 不用 merge ref 替代被测 head。
env:
  CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  ut:
    name: UT 18 / race / coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - name: 固定 Go/Node/Python 工具
        run: >-
          python3 scripts/acceptance/bootstrap_linux.py --prefix "$RUNNER_TEMP/tools"
          --record "$RUNNER_TEMP/private/bootstrap.json" --public-report "$RUNNER_TEMP/ut-public/bootstrap.json"
      - name: 一次执行 UT 与质量检查
        run: |
          python scripts/acceptance/capture.py --private-root "$RUNNER_TEMP/raw" --label ut \
            --public-report "$RUNNER_TEMP/ut-public/command.json" --candidate "$CANDIDATE" -- make ut PYTHON=python
          cp .scratch/ut-results.json "$RUNNER_TEMP/ut-public/ut-results.json"
      - name: 上传安全 UT 结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ut-public/
          if-no-files-found: error
          retention-days: 14
  e2e:
    name: E2E / ${{ matrix.shard }} / 独占双集群
    # 关键：私有 Operator 凭据只提供给可信同仓 job；不使用 pull_request_target。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # 某组失败后其余组继续取证；每个 runner 只清理自己的原身份资源。
      fail-fast: false
      matrix:
        shard: [topology, storage, recovery]
    env:
      BUILDX_BUILDER: mm-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - name: 固定工具、Helm 与 Chromium
        run: |
          python3 scripts/acceptance/bootstrap_linux.py --prefix "$RUNNER_TEMP/tools" \
            --record "$RUNNER_TEMP/private/bootstrap.json" --public-report "$RUNNER_TEMP/e2e-bootstrap-public/bootstrap.json" --browsers
          python3 scripts/install-helm.py "$RUNNER_TEMP/tools/bin/helm"
      - name: 固定独占 BuildKit，支持经校验的 OCI 输入
        run: make ci-builder PYTHON=python
      - name: 仅此步骤获取锁定发布 CLI 源码
        env:
          MONITOR_OP_DEPLOY_KEY: ${{ secrets.MONITOR_OP_DEPLOY_KEY }}
          MONITOR_OP_SOURCE_REPOSITORY: ${{ secrets.MONITOR_OP_SOURCE_REPOSITORY }}
        run: >-
          python scripts/acceptance/fetch_source.py --destination "$RUNNER_TEMP/monitor-op"
          --private-root "$RUNNER_TEMP/private/source-access"
      - name: 仅此步骤获取原始私有 release 资产
        env:
          # 跨仓只读 token 仅供 gh 下载，不能带入构建或公开 artifact。
          GH_TOKEN: ${{ secrets.MONITOR_OP_RELEASE_TOKEN }}
        run: >-
          python scripts/acceptance/operator_release.py fetch
          --bundle "$RUNNER_TEMP/operator-bundle"
      - name: 自动准备并执行本组E2E
        run: >-
          MONITOR_OP_RELEASE_BUNDLE="$RUNNER_TEMP/operator-bundle" make e2e PYTHON=python
          E2E_ARGS="--candidate $CANDIDATE --run-id mm-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }} --shard ${{ matrix.shard }}
          --monitor-op-source $RUNNER_TEMP/monitor-op --output $RUNNER_TEMP/e2e"
      - name: 中断后独立按原身份清理
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/e2e/.private/environment.json"; then
            python scripts/e2e.py --cleanup "$RUNNER_TEMP/e2e"
          fi
      - name: 按原身份清理独占构建器
        if: always()
        run: make ci-builder-cleanup PYTHON=python
      - name: 上传安全结果与截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/e2e/public/
            ${{ runner.temp }}/e2e-bootstrap-public/
          if-no-files-found: error
          retention-days: 14
  e2e-summary:
    # 保留完整 E2E check 名称，只有三组原始结果与全部清理成功才变绿。
    name: E2E 10 / 独占双集群
    needs: e2e
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - name: 获取本次运行的三个安全结果
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh run download "${{ github.run_id }}" --repo "$GITHUB_REPOSITORY"
          --pattern "e2e-${{ github.run_id }}-${{ github.run_attempt }}-*" --dir "$RUNNER_TEMP/shards"
      - name: 核验同候选、无漏跑或重复、全部清理成功
        run: >-
          make e2e-summary PYTHON=python3
          E2E_SUMMARY_ARGS="--input $RUNNER_TEMP/shards --output $RUNNER_TEMP/summary/results.json
          --candidate $CANDIDATE --run-id mm-ci-${{ github.run_id }}-${{ github.run_attempt }}
          --jobs-result ${{ needs.e2e.result }}"
      - name: 上传完整10项汇总
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-complete-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary/
          if-no-files-found: error
          retention-days: 14
