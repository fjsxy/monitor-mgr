name: 一期 UT 与真实双集群 E2E
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
# 两个 job 均 checkout 同一个真实候选，PR 不用 merge ref 替代被测 head。
env:
  CANDIDATE: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  ut:
    name: UT 18 / race / coverage
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - name: 固定 Go/Node/Python 工具
        run: >-
          python3 scripts/acceptance/bootstrap_linux.py --prefix "$RUNNER_TEMP/tools"
          --record "$RUNNER_TEMP/private/bootstrap.json" --public-report "$RUNNER_TEMP/ut-public/bootstrap.json"
      - name: 一次执行 UT 与质量检查
        run: |
          python scripts/acceptance/capture.py --private-root "$RUNNER_TEMP/raw" --label ut \
            --public-report "$RUNNER_TEMP/ut-public/command.json" --candidate "$CANDIDATE" -- make ut PYTHON=python
          cp .scratch/ut-results.json "$RUNNER_TEMP/ut-public/ut-results.json"
      - name: 上传安全 UT 结果
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ut-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ut-public/
          if-no-files-found: error
          retention-days: 14
  e2e:
    name: E2E 10 / 独占双集群
    # 关键：私有 Operator 凭据只提供给可信同仓 job；不使用 pull_request_target。
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - name: 固定工具、Helm 与 Chromium
        run: |
          python3 scripts/acceptance/bootstrap_linux.py --prefix "$RUNNER_TEMP/tools" \
            --record "$RUNNER_TEMP/private/bootstrap.json" --public-report "$RUNNER_TEMP/e2e-bootstrap-public/bootstrap.json" --browsers
          python3 scripts/install-helm.py "$RUNNER_TEMP/tools/bin/helm"
      - name: 仅此步骤获取锁定私有源码
        env:
          MONITOR_OP_DEPLOY_KEY: ${{ secrets.MONITOR_OP_DEPLOY_KEY }}
          MONITOR_OP_SOURCE_REPOSITORY: ${{ secrets.MONITOR_OP_SOURCE_REPOSITORY }}
        run: >-
          python scripts/acceptance/fetch_source.py --destination "$RUNNER_TEMP/monitor-op"
          --private-root "$RUNNER_TEMP/private/source-access"
      - name: 自动准备并执行全部10项E2E
        run: >-
          make e2e PYTHON=python
          E2E_ARGS="--candidate $CANDIDATE --run-id mm-ci-${{ github.run_id }}-${{ github.run_attempt }}
          --monitor-op-source $RUNNER_TEMP/monitor-op --output $RUNNER_TEMP/e2e"
      - name: 中断后独立按原身份清理
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/e2e/.private/environment.json"; then
            python scripts/e2e.py --cleanup "$RUNNER_TEMP/e2e"
          fi
      - name: 上传安全结果与截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/e2e/public/
            ${{ runner.temp }}/e2e-bootstrap-public/
          if-no-files-found: error
          retention-days: 14
